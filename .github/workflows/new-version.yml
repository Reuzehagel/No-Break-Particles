name: Publish new Minecraft versions

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      versions:
        description: "Packs to publish, space-separated (empty = new releases only)"
        default: ""

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run check.py # refuse to publish if build.py no longer matches the golden release
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run publish.py --go $VERSIONS
        env:
          VERSIONS: ${{ inputs.versions }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
